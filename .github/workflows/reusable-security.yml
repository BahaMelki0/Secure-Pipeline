name: Reusable security pipeline

on:
  workflow_call:
    inputs:
      scan-path:
        description: Repository-relative path to scan
        type: string
        default: .
      policy-path:
        description: Repository-relative policy; the toolkit default is used when absent
        type: string
        default: .github/security-policy.yml
      dockerfile:
        description: Dockerfile path relative to the scanned repository
        type: string
        default: Dockerfile
      enable-container-scan:
        description: Build and scan a container when the Dockerfile exists
        type: boolean
        default: true
      toolkit-repository:
        description: Repository containing the SecurePipeline aggregator
        type: string
        default: BahaMelki0/Secure-Pipeline
      toolkit-ref:
        description: SecurePipeline tag, branch, or commit to execute
        type: string
        default: main

permissions:
  contents: read

jobs:
  security:
    name: Scan, aggregate, and gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REPORT_DIR: ${{ github.workspace }}/security-reports
      TARGET_DIR: ${{ github.workspace }}/target
      TOOLKIT_DIR: ${{ github.workspace }}/.secure-pipeline
      IMAGE_TAG: secure-pipeline-target:${{ github.sha }}
      SCAN_PATH: ${{ inputs.scan-path }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      REQUESTED_POLICY: ${{ inputs.policy-path }}

    steps:
      - name: Check out target repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Check out SecurePipeline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.toolkit-repository }}
          ref: ${{ inputs.toolkit-ref }}
          path: .secure-pipeline
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .secure-pipeline/requirements.txt

      - name: Validate target paths
        id: paths
        shell: bash
        run: PYTHONPATH="$TOOLKIT_DIR" python -m aggregator.workflow_paths

      - name: Prepare reports and scanners
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          # This report is intentionally empty when the optional container stage is skipped.
          printf '{"Results":[]}' > "$REPORT_DIR/trivy-container.json"
          python -m pip install --disable-pip-version-check \
            -r "$TOOLKIT_DIR/requirements.txt" \
            semgrep==1.164.0 checkov==3.2.529

      - name: SAST - Semgrep
        shell: bash
        run: |
          set +e
          semgrep scan --config p/default --json \
            --output "$REPORT_DIR/semgrep.json" \
            "$SCAN_DIR"
          scanner_status=$?
          set -e
          if [[ "$scanner_status" -gt 1 ]]; then exit "$scanner_status"; fi

      - name: Secrets - Gitleaks
        shell: bash
        run: |
          docker run --rm \
            -v "$TARGET_DIR:/repo" \
            -v "$REPORT_DIR:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --report-format json --report-path /reports/gitleaks.json \
            --redact=100 --exit-code 0

      - name: Dependencies - Trivy filesystem
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.SCAN_DIR }}
          scanners: vuln
          format: json
          output: security-reports/trivy-fs.json
          exit-code: "0"

      - name: Detect container target
        id: container
        shell: bash
        env:
          ENABLED: ${{ inputs.enable-container-scan }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [[ "$ENABLED" == "true" && -f "$DOCKERFILE_PATH" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build target container
        if: steps.container.outputs.exists == 'true'
        shell: bash
        run: docker build --file "$DOCKERFILE_PATH" --tag "$IMAGE_TAG" "$TARGET_DIR"

      - name: Container - Trivy image
        if: steps.container.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: json
          output: security-reports/trivy-container.json
          exit-code: "0"

      - name: Infrastructure as code - Checkov
        shell: bash
        run: |
          set +e
          checkov -d "$SCAN_DIR" \
            --output json --quiet > "$REPORT_DIR/checkov.json"
          scanner_status=$?
          set -e
          if [[ "$scanner_status" -gt 1 ]]; then exit "$scanner_status"; fi

      - name: SBOM - Syft CycloneDX
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ env.SCAN_DIR }}
          format: cyclonedx-json
          output-file: security-reports/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Select security policy
        id: policy
        shell: bash
        env:
          REQUESTED_POLICY: ${{ inputs.policy-path }}
        run: |
          if [[ -f "$REQUESTED_POLICY_FILE" ]]; then
            echo "path=$REQUESTED_POLICY_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "path=$TOOLKIT_DIR/policy/security-policy.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: Aggregate findings and enforce policy
        shell: bash
        env:
          POLICY_FILE: ${{ steps.policy.outputs.path }}
          CONTAINER_PRESENT: ${{ steps.container.outputs.exists }}
        run: |
          set +e
          container_input=()
          if [[ "$CONTAINER_PRESENT" == "true" ]]; then
            container_input=(--input "trivy-container=$REPORT_DIR/trivy-container.json")
          fi
          PYTHONPATH="$TOOLKIT_DIR" python -m aggregator \
            --policy "$POLICY_FILE" \
            --input "semgrep=$REPORT_DIR/semgrep.json" \
            --input "gitleaks=$REPORT_DIR/gitleaks.json" \
            --input "trivy-fs=$REPORT_DIR/trivy-fs.json" \
            "${container_input[@]}" \
            --input "checkov=$REPORT_DIR/checkov.json" \
            --markdown "$REPORT_DIR/security-report.md" \
            --html "$REPORT_DIR/security-report.html" \
            --json "$REPORT_DIR/normalized-findings.json"
          status=$?
          if [[ -f "$REPORT_DIR/security-report.md" ]]; then
            cat "$REPORT_DIR/security-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SecurePipeline could not generate a decision report; inspect scanner/aggregation errors." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload raw and consolidated security artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: secure-pipeline-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: error
          retention-days: 14
